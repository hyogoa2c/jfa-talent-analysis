[project]
name = "jfa-talent-analysis"
version = "0.1.0"
description = "Quantitative analysis of Japanese football talent-development pathways, coach networks, and player career outcomes."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "lifelines>=0.30.3",
    "matplotlib>=3.11.0",
    "numpy>=2.5.1",
    "pandas>=2.3.3",
    "scipy>=1.18.0",
    "statsmodels>=0.14.6",
]

[project.scripts]
jfa-talent-analysis = "jfa_talent_analysis.cli:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
